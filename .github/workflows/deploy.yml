name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse README.md
        run: node src/scripts/parseReadme.js ../README.md

      - name: Validate channels.json exists
        run: |
          if [ ! -f public/channels.json ]; then
            echo "Error: channels.json not generated"
            exit 1
          fi

      - name: Validate minimum channel count
        run: |
          CHANNEL_COUNT=$(jq '.channels | length' public/channels.json)
          echo "Channel count: $CHANNEL_COUNT"
          if [ "$CHANNEL_COUNT" -lt 200 ]; then
            echo "Error: Only $CHANNEL_COUNT channels found (minimum 200 required)"
            exit 1
          fi

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
